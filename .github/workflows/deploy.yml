name: 部署至 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取得網站檔案
        uses: actions/checkout@v4
      - name: 設定執行環境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 驗證收入計算
        run: npm run check
      - name: 設定 Pages
        uses: actions/configure-pages@v5
      - name: 整理公開網站檔案
        run: |
          mkdir _site
          cp index.html styles.css calculator.js app.js muyu.js favicon.svg .nojekyll _site/
          cp zen.css muyu.png _site/
      - name: 上傳網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 部署網站
        id: deployment
        uses: actions/deploy-pages@v4
